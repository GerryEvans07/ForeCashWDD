<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ForeCash</title>
    <meta name="description" content="ForeCash: aplikasi web peringatan dini keuangan untuk mahasiswa.">
    <!-- Tailwind CSS + warna kustom -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tw-config.js"></script>
    <!-- Font, ikon, dan grafik -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full space-y-6 text-center">
        <div class="w-32 h-32 mx-auto character-bounce">
            <div class="w-32 h-32 bg-hsOrange rounded-full shadow-lg flex flex-col items-center justify-center border-4 border-white">
                <div class="flex gap-4 mb-2"><div class="w-4 h-5 bg-hsDark rounded-full hs-eye"></div><div class="w-4 h-5 bg-hsDark rounded-full hs-eye"></div></div>
                <div class="w-8 h-4 border-b-4 border-hsDark rounded-full"></div>
            </div>
        </div>

        <div class="space-y-2">
            <h1 class="text-4xl font-black text-hsDark">ForeCash</h1>
            <p class="text-sm font-medium text-slate-600 px-4">
                Atur keuangan mahasiswa lebih tenang dengan <span class="text-hsOrange font-extrabold">Peringatan Dini</span> &amp; <span class="text-hsBlue font-extrabold">Multi-Wallet</span>.
            </p>
        </div>

        <div class="hs-card p-6 sm:p-8 space-y-5 text-left">
            <div class="flex bg-slate-100 p-1.5 rounded-2xl">
                <button type="button" id="tabMasuk">Login</button>
                <button type="button" id="tabDaftar">Registrasi</button>
            </div>

            <p id="authError" class="text-sm font-bold text-hsRed"></p>

            <form id="authForm" class="space-y-4">
                <div class="only-daftar hidden space-y-1">
                    <label for="role" class="text-xs font-bold uppercase tracking-wider">Daftar Sebagai</label>
                    <select id="role" class="w-full px-4 py-3 border text-sm font-semibold">
                        <option value="mahasiswa">🎓 Mahasiswa</option>
                        <option value="orangtua">👨‍👩‍👧 Orang Tua / Wali</option>
                    </select>
                </div>
                <div class="only-daftar hidden space-y-1">
                    <label for="nama" class="text-xs font-bold uppercase tracking-wider">Nama Lengkap</label>
                    <input id="nama" placeholder="Nama lengkap" class="w-full px-4 py-3 border text-sm font-semibold">
                </div>
                <div class="space-y-1">
                    <label for="email" class="text-xs font-bold uppercase tracking-wider">Email</label>
                    <input id="email" type="email" required placeholder="nama@student.umn.ac.id" class="w-full px-4 py-3 border text-sm font-semibold">
                </div>
                <div class="space-y-1">
                    <label for="password" class="text-xs font-bold uppercase tracking-wider">Kata Sandi</label>
                    <input id="password" type="password" required placeholder="••••••••" class="w-full px-4 py-3 border text-sm font-semibold">
                </div>
                <button id="btnSubmit" class="hs-btn bg-hsOrange text-white w-full py-3.5 text-base">Masuk</button>
            </form>

            <div class="bg-slate-50 rounded-2xl p-3 text-[11px] text-slate-600 space-y-1">
                <p class="font-bold">Akun demo</p>
                <p>Mahasiswa: demo@forecash.id · Orang tua: ortu@forecash.id · Sandi: demo12345</p>
                <button type="button" onclick="resetDemo()" class="font-bold text-hsOrange">Reset data demo</button>
            </div>
        </div>
        <a href="index.html" class="text-xs font-bold text-slate-500">← Kembali ke beranda</a>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
