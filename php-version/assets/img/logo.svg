<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Logo ForeCash" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FFC83D"/>
    </linearGradient>
    <linearGradient id="bgEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A81E"/><stop offset="1" stop-color="#D98A0B"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFD36B"/><stop offset="0.55" stop-color="#FFA62B"/><stop offset="1" stop-color="#F27C12"/>
    </radialGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E06A0C"/><stop offset="1" stop-color="#B9520A"/>
    </linearGradient>
    <linearGradient id="leafL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BC48A"/><stop offset="1" stop-color="#23805A"/>
    </linearGradient>
    <linearGradient id="leafR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DB47C"/><stop offset="1" stop-color="#1D6E4C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#8A4A00" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- tile dengan sisi tebal (efek 3D) -->
  <rect x="8" y="18" width="240" height="232" rx="58" fill="url(#bgEdge)"/>
  <rect x="8" y="6" width="240" height="232" rx="58" fill="url(#bg)"/>
  <path d="M40 30 Q128 6 216 30" stroke="#FFF6CF" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- garis sinar -->
  <g stroke="#FF8A3D" stroke-width="9" stroke-linecap="round" opacity="0.9">
    <line x1="38" y1="118" x2="56" y2="124"/><line x1="46" y1="88" x2="62" y2="100"/>
    <line x1="218" y1="118" x2="200" y2="124"/><line x1="210" y1="88" x2="194" y2="100"/>
  </g>

  <!-- tunas -->
  <g filter="url(#soft)">
    <path d="M128 112 C127 92 128 80 130 66" stroke="#23805A" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M128 74 C104 42 66 44 56 62 C70 86 106 92 128 74Z" fill="url(#leafL)"/>
    <path d="M131 70 C150 36 192 34 202 54 C190 80 152 88 131 70Z" fill="url(#leafR)"/>
    <path d="M66 62 C88 58 108 64 124 74" stroke="#9BE3B9" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- koin dengan ketebalan -->
  <g filter="url(#soft)">
    <ellipse cx="136" cy="170" rx="64" ry="64" fill="url(#coinEdge)"/>
    <circle cx="126" cy="166" r="64" fill="url(#coin)"/>
    <circle cx="126" cy="166" r="52" fill="none" stroke="#FFC35A" stroke-width="5" opacity="0.8"/>
    <ellipse cx="100" cy="134" rx="22" ry="12" fill="#FFF3C4" opacity="0.65" transform="rotate(-30 100 134)"/>
  </g>

  <!-- wajah -->
  <g fill="#1F3B32">
    <ellipse cx="106" cy="162" rx="9" ry="12"/><ellipse cx="144" cy="162" rx="9" ry="12"/>
  </g>
  <circle cx="109" cy="157" r="3.2" fill="#fff"/><circle cx="147" cy="157" r="3.2" fill="#fff"/>
  <path d="M112 186 Q125 197 138 186" stroke="#1F3B32" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <ellipse cx="92" cy="180" rx="8" ry="5" fill="#FF7A59" opacity="0.45"/><ellipse cx="160" cy="180" rx="8" ry="5" fill="#FF7A59" opacity="0.45"/>
</svg>
